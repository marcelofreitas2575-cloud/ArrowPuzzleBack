name: .NET CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: dotnet-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ArrowPuzzle.sln

      - name: Build
        run: dotnet build ArrowPuzzle.sln --no-restore -c Release

      - name: Test
        run: dotnet test ArrowPuzzle.sln --no-build -c Release --verbosity normal

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose -f deploy/docker/docker-compose.yml config --quiet
