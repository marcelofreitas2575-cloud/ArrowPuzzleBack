$kind: http-request
name: Dev token (guest)
method: POST
url: '{{gateway_base_url}}/api/v1/auth/dev-token'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "guest-player",
      "password": "guest-player"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      if (pm.response.code === 200) {
        const json = pm.response.json();
        pm.collectionVariables.set('access_token', json.access_token);
      }
